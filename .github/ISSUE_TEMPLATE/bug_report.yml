name: Bug report
description: Report a problem with PyxisSapiens
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in as much detail as possible.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Tap on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version / commit
      placeholder: e.g. 0.1.0 or commit hash
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device & Android version
      placeholder: e.g. Pixel 6, Android 14
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Relevant logcat output or screenshots (do not include secrets).
    validations:
      required: false
