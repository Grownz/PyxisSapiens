name: Feature request
description: Suggest an idea or improvement for PyxisSapiens
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve PyxisSapiens. Please describe the idea and its use case.
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What geological or field workflow does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Measurement / compass
        - Data management
        - Analysis / stereonet
        - Map / linework / tracking
        - Export / import / interop
        - Calibration
        - UI / accessibility
        - Other
    validations:
      required: true
