name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          set +e
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1
          "$SDKMANAGER" "platform-tools" > /dev/null 2>&1
          "$SDKMANAGER" "platforms;android-37" > /dev/null 2>&1
          "$SDKMANAGER" "build-tools;36.0.0" > /dev/null 2>&1
          echo "Installed SDK packages (AGP will fetch anything still missing)."

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build, test and lint
        run: ./gradlew --no-daemon assembleDebug test lint

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: pyxissapiens-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
